apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
spec:
  instances: 1

  http:
    httpEnabled: true

  db:
    vendor: postgres
    host: postgresql-db
    database: keycloak
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password

  hostname:
    hostname: https://keycloak-service-rhbk.apps.cluster-k2zc4.k2zc4.sandbox513.opentlc.com

  proxy:
    headers: xforwarded